[package]
name = "anyarc"
version = "0.1.0"
edition = "2024"
description = "Universal archive tool: extract/test/list/create, zero external dependencies"
license = "MIT OR Apache-2.0"
# TODO:发布前改为真实仓库地址(当前无 remote;dist 需要一个规范 URL)
repository = "https://github.com/TODO/anyarc"

[lib]
name = "anyarc"
path = "src/lib.rs"

[[bin]]
name = "anyarc"
path = "src/main.rs"

[[bin]]
name = "matrix"
path = "src/bin/matrix.rs"

# 发布配置:单文件静态二进制(≤25 MB 验收),LTO + 去调试符号
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
sevenz-rust2 = "0.24.1"
sha2 = "0.11.1"
unarc-rs = "0.8.1"
zip = { version = "9.1.3", default-features = false, features = ["deflate", "bzip2", "zstd", "aes-crypto"] }
clap = { version = "4.5.50", features = ["derive"] }
rpassword = "7.4.0"
flate2 = "1.1.10"
bzip2 = "0.6.1"
zstd = "0.14.3"
encoding_rs = "0.8.44"
anyhow = "1.0.104"
lzma-rs = { version = "0.3.0", features = ["raw_decoder"] }
lz4_flex = "0.14"
tar = "0.4.46"
lzma-rust2 = "0.24.0"
claxon = "0.4.3"
ape-decoder = "0.3.2"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
indicatif = "0.18"

# matrix(验收工具)需要;主二进制不用
[dev-dependencies]
